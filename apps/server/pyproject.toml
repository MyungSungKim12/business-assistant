[project]
name = "business-assistant-server"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "business-assistant-common",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "supabase>=2.17,<3",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
business-assistant-common = { workspace = true }
