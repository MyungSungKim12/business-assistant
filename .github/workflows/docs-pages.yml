name: 문서 사이트 검증 및 배포

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 문서 엄격 빌드
    runs-on: ubuntu-latest
    steps:
      - name: 소스 받기
        uses: actions/checkout@v5

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: 문서 도구 설치
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: 문서 구조 검사
        shell: pwsh
        run: ./scripts/docs/validate-guide.ps1

      - name: 사이트 생성
        run: mkdocs build --strict

      - name: Pages 파일 업로드
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: GitHub Pages 배포
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v5
