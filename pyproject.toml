[project]
name = "business-assistant-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/common", "apps/server", "apps/desktop"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["apps", "packages"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["packages/common/src"]
